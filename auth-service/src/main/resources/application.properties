spring.application.name=auth-service
server.port=${AUTH_PORT:8081}

spring.datasource.url=${AUTH_DATABASE_URL}
spring.datasource.username=${AUTH_DATABASE_USERNAME}
spring.datasource.password=${AUTH_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

auth.jwt.secret=${JWT_SECRET}
auth.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}