
spring.application.name=sales-service
server.port=${SALES_PORT:8083}

spring.datasource.url=${SALES_DATABASE_URL}
spring.datasource.username=${SALES_DATABASE_USERNAME}
spring.datasource.password=${SALES_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

auth.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

sales.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8080}
sales.customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
